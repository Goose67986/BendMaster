name: Build Play testing bundle
on:
  push:
    branches: [ "main" ]
    paths: [ "app/**", "build.gradle", ".github/workflows/play-bundle.yml" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint release
        run: gradle bundleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BendPro360-v1.0-unsigned-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-lint
          path: app/build/reports/lint-results-release.*
