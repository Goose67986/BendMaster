name: Build BendPro 360 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "BendPro360-v${VERSION}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BendPro360-v${{ steps.version.outputs.version }}-apk
          path: BendPro360-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          name: BendPro 360 v${{ steps.version.outputs.version }}
          body: |
            Automated BendPro 360 Android test build.

            Download the APK below and install it on your Android device.
          files: BendPro360-v${{ steps.version.outputs.version }}.apk
          make_latest: true
